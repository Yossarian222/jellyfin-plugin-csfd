name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Verzia na vydanie, napr. 1.0.0 (prázdne = len build)'
        required: false
        default: ''
      notes:
        description: 'Poznámky k vydaniu'
        required: false
        default: ''

permissions:
  contents: write

env:
  # Verzia Jellyfin NuGet balíkov a cieľové ABI v manifeste.
  JELLYFIN_VERSION: '12.0.0'
  TARGET_ABI: '12.0.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verzia
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RELEASE=false
          if [[ -n "$INPUT_VERSION" ]]; then
            V="${INPUT_VERSION#v}"; RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; RELEASE=true
          else
            V="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          # Jellyfin chce 4-zložkovú číselnú verziu (v1.2.0-beta → 1.2.0.0)
          V="${V%%-*}"
          IFS='.' read -r a b c d <<< "$V"
          echo "version=${a:-0}.${b:-0}.${c:-0}.${d:-0}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test Jellyfin.Plugin.Csfd.Tests -c Release -p:JellyfinVersion=${JELLYFIN_VERSION}

      - name: Build
        run: |
          dotnet publish Jellyfin.Plugin.Csfd -c Release -o out \
            -p:JellyfinVersion=${JELLYFIN_VERSION} \
            -p:AssemblyVersion=${{ steps.ver.outputs.version }} \
            -p:FileVersion=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cd out && zip -j "../dist/csfd_${{ steps.ver.outputs.version }}.zip" Jellyfin.Plugin.Csfd.dll

      - uses: actions/upload-artifact@v4
        with:
          name: csfd_${{ steps.ver.outputs.version }}
          path: dist/*.zip

      - name: Release + manifest
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          ZIP="dist/csfd_${VERSION}.zip"
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/csfd_${VERSION}.zip"
          NOTES="$INPUT_NOTES"
          [ -z "$NOTES" ] && NOTES=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | head -c 1000)
          [ -z "$NOTES" ] && NOTES="Release ${TAG}"

          # Pri spustení z Actions tag ešte neexistuje – gh ho vytvorí na aktuálnom commite.
          gh release create "$TAG" "$ZIP" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"

          git fetch origin main
          git checkout main
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg v "$VERSION" --arg abi "$TARGET_ABI" --arg url "$URL" --arg md5 "$MD5" --arg ts "$TS" --arg log "$NOTES" \
            '.[0].versions = ([{version:$v, changelog:$log, targetAbi:$abi, sourceUrl:$url, checksum:$md5, timestamp:$ts}] + [.[0].versions[] | select(.version != $v)])' \
            manifest.json > manifest.tmp && mv manifest.tmp manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: ${VERSION}" || echo "bez zmeny"
          git push origin main
