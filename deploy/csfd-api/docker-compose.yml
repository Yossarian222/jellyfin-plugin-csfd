# Portainer stack: csfd-api (sidecar pre Jellyfin ČSFD plugin)
# Portainer -> Stacks -> Add stack -> Web editor -> vlož tento súbor.
# V sekcii "Environment variables" nastav CSFD_API_KEY (napr. výstup `openssl rand -hex 24`).
#
# Test po nasadení (z PC v LAN):
#   curl -H "x-api-key: <KLUC>" "http://192.168.1.201:3080/movie/8852?language=sk"

services:
  csfd-api:
    image: bartholomej/node-csfd-api:latest
    container_name: csfd-api
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      - PORT=3000
      # Plugin posiela jazyk v každom requeste (?language=sk|cs|en).
      - API_KEY=${CSFD_API_KEY:?CSFD_API_KEY musí byť nastavený}
      - API_KEY_NAME=x-api-key
      - TZ=Europe/Bratislava
    labels:
      # Watchtower je u teba v notifikačnom režime -> dá vedieť o novej verzii.
      - com.centurylinklabs.watchtower.enable=true
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"x-api-key: $$API_KEY\" http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
